name: E2E Ciphertext Confidentiality

# Hard gate: sealed DMs/groups stay opaque; plaintext violation attempts are rejected.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-ciphertext:
    name: E2E Ciphertext Confidentiality (must not decode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-7.0.24-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run E2E ciphertext + encryption violation suites
        run: npm run test:security:e2e-violations
